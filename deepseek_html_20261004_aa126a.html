<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>药伴 · 康护版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;padding:30px 20px;min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  color:#2F3B22;
  display:flex;align-items:center;justify-content:center;
  background: #FFFFFF;
  overflow-x:hidden;
}
/* ============ 手机外框 ============ */
.phone{
  position:relative;z-index:2;flex:0 0 auto;
  width:390px;height:844px;padding:11px;border-radius:50px;
  background:linear-gradient(150deg,rgba(255,255,255,.88),rgba(255,255,255,.36));
  box-shadow:0 40px 80px rgba(47,59,34,.15),0 0 0 1px rgba(0,0,0,.06),inset 0 2px 12px rgba(255,255,255,.9);
  backdrop-filter:blur(24px) saturate(1.5);
}
.screen{
  position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;isolation:isolate;
  background:linear-gradient(170deg,#F1F9DC 0%,#DCEFA4 52%,#C5DE6A 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.65);
}
.screen::before,.screen::after{content:'';position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none;z-index:0}
.screen::before{width:260px;height:260px;background:rgba(255,255,255,.8);top:-80px;left:-70px}
.screen::after{width:320px;height:320px;background:rgba(168,201,74,.42);bottom:-100px;right:-100px}
#app{position:absolute;inset:0;z-index:1}
#layer{position:absolute;inset:0;z-index:20;pointer-events:none}
#layer>*{pointer-events:auto}

/* ============ 截图展开模式 ============ */
.phone.capturing{height:auto !important;border-radius:44px}
.phone.capturing .screen{height:auto !important;overflow:visible !important;border-radius:36px}
.phone.capturing #app{position:relative !important;inset:auto !important}
.phone.capturing .page{position:relative !important;inset:auto !important}
.phone.capturing .scroll{overflow:visible !important;height:auto !important;flex:none !important}
.phone.capturing *{animation:none !important;transition:none !important}

/* ============ 页面骨架 ============ */
.page{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:14px 16px 20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px;gap:8px}
.tb-title{font-size:17px;font-weight:900;letter-spacing:.5px}
.tb-acts{display:flex;gap:6px}
.tabbar{
  flex:0 0 auto;display:flex;gap:4px;margin:0 12px 14px;padding:9px 8px;border-radius:26px;
  background:linear-gradient(150deg,rgba(255,255,255,.82),rgba(255,255,255,.52));
  backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 10px 26px rgba(47,59,34,.13),inset 0 1px 0 rgba(255,255,255,.95);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:18px;
  border:none;background:transparent;font-family:inherit;font-weight:800;font-size:10.5px;color:#6E7D5A;
  cursor:pointer;transition:.18s;line-height:1.1;
}
.tab.active{background:linear-gradient(150deg,#DCF08F,#B8D656);color:#2F3B22;box-shadow:0 6px 14px rgba(168,201,74,.42)}
.tab .ico{opacity:.85}
.tab.active .ico{opacity:1}

/* ============ 玻璃卡片 ============ */
.glass{
  background:linear-gradient(150deg,rgba(255,255,255,.76),rgba(255,255,255,.44));
  backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 10px 26px rgba(47,59,34,.10),inset 0 1px 0 rgba(255,255,255,.95);
}
.card{padding:16px;border-radius:22px;margin-bottom:12px}
.card-title{font-size:16px;font-weight:900;letter-spacing:.2px}
.card-sub{font-size:12.5px;color:#6E7D5A;margin-top:4px;line-height:1.5;font-weight:600}
.sec-title{font-size:23px;font-weight:900;margin:2px 0 12px;letter-spacing:.5px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{font-size:11px;font-weight:800;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.75);color:#6E7D5A;white-space:nowrap;border:1px solid rgba(255,255,255,.9)}
.pill.ok{background:linear-gradient(150deg,#DCF08F,#B8D656);color:#2F3B22}
.pill.warn{background:linear-gradient(150deg,#FFE7A8,#F6C24A);color:#6B4A00}

/* ============ 按钮 ============ */
.btn{
  border:1px solid rgba(255,255,255,.85);font-family:inherit;font-weight:800;cursor:pointer;
  border-radius:999px;padding:13px 18px;font-size:15px;color:#2F3B22;
  background:linear-gradient(150deg,rgba(255,255,255,.82),rgba(255,255,255,.52));
  backdrop-filter:blur(12px);
  box-shadow:0 6px 16px rgba(47,59,34,.10),inset 0 1px 0 rgba(255,255,255,.95);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:scale(.96);box-shadow:0 3px 8px rgba(47,59,34,.12)}
.btn.primary{background:linear-gradient(150deg,#E4F59C,#B8D656 62%,#A8C94A);box-shadow:0 10px 22px rgba(168,201,74,.45),inset 0 1px 0 rgba(255,255,255,.85)}
.btn.dark{background:linear-gradient(150deg,#4A5836,#2F3B22);color:#F2F8E4;border-color:rgba(255,255,255,.3)}
.btn.block{display:block;width:100%;margin-top:10px}
.btn.small{padding:9px 14px;font-size:12.5px}
.btn.huge{font-size:25px;padding:22px 20px;border-radius:28px;font-weight:900}
.btn.text{background:none;border:none;box-shadow:none;color:#4A5836;text-decoration:underline;font-size:13px}

.chip{
  padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;font-family:inherit;
  border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.62);color:#4A5836;
  cursor:pointer;transition:.15s;backdrop-filter:blur(10px);
}
.chip.active{background:linear-gradient(150deg,#DCF08F,#B8D656);color:#2F3B22;box-shadow:0 4px 12px rgba(168,201,74,.4)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}

/* ============ 登录页 ============ */
.login-wrap{justify-content:center;padding:0 24px}
.brand{text-align:center;margin-bottom:26px}
.brand-mark{
  width:76px;height:76px;margin:0 auto 14px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(150deg,#EAF9AE,#B8D656 60%,#A8C94A);
  color:#2F3B22;box-shadow:0 16px 30px rgba(168,201,74,.45),inset 0 2px 0 rgba(255,255,255,.8);
}
.brand-title{font-size:26px;font-weight:900;letter-spacing:1px}
.brand-sub{font-size:12.5px;color:#6E7D5A;font-weight:700;margin-top:6px;letter-spacing:.5px}
.label{font-size:12px;font-weight:800;color:#6E7D5A;margin:12px 0 6px}
.input{
  width:100%;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);
  border-radius:16px;padding:13px 14px;font-size:15px;font-family:inherit;font-weight:700;color:#2F3B22;outline:none;
}
.input::placeholder{color:#9AA88A;font-weight:600}
.input-row{display:flex;gap:8px;align-items:center}
.tiny{text-align:center;font-size:11px;color:#6E7D5A;margin-top:16px;font-weight:600;line-height:1.6}

/* ============ 首页 ============ */
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.greet{font-size:25px;font-weight:900;letter-spacing:.5px}
.date-line{font-size:12.5px;color:#6E7D5A;font-weight:700;margin-top:6px}
.avatar{
  width:54px;height:54px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(255,255,255,.5));
  border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 18px rgba(47,59,34,.12);color:#4A5836;
}
.days-badge{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 13px;border-radius:999px;
  background:linear-gradient(150deg,#E4F59C,#B8D656);font-size:12.5px;font-weight:900;
  box-shadow:0 6px 14px rgba(168,201,74,.4);
}
.overview{display:flex;gap:10px;margin-top:14px}
.ov{flex:1;text-align:center;padding:12px 6px;border-radius:18px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85)}
.ov-ring{
  width:44px;height:44px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#6E7D5A;background:rgba(255,255,255,.9);
  border:2px dashed rgba(154,168,138,.6);
}
.ov-ring.done{
  color:#2F3B22;border:2px solid transparent;
  background:linear-gradient(150deg,#E4F59C,#B8D656);box-shadow:0 6px 14px rgba(168,201,74,.4);
}
.ov-label{font-size:12px;font-weight:800;color:#4A5836}
.mode-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;margin-bottom:11px;cursor:pointer;transition:.15s}
.mode-card:active{transform:scale(.98)}
.mode-ico{
  width:50px;height:50px;flex:0 0 auto;border-radius:17px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,rgba(232,245,184,.95),rgba(197,222,106,.85));color:#2F3B22;
  border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}
.mode-name{font-size:16.5px;font-weight:900}
.mode-desc{font-size:12px;color:#6E7D5A;font-weight:700;margin-top:4px;line-height:1.5}
.mode-arrow{margin-left:auto;color:#9AA88A;font-weight:900;font-size:18px}
.quick{display:flex;gap:10px;margin-top:4px}

/* ============ 通用条目 ============ */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid rgba(47,59,34,.08)}
.setrow:last-child{border-bottom:none;padding-bottom:4px}
.st-name{font-size:14.5px;font-weight:800}
.st-sub{font-size:11.5px;color:#6E7D5A;font-weight:600;margin-top:3px;line-height:1.45}
.switch{
  width:50px;height:30px;border-radius:999px;flex:0 0 auto;cursor:pointer;position:relative;transition:.22s;
  background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.95);
  box-shadow:inset 0 2px 6px rgba(47,59,34,.1);
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(47,59,34,.22);transition:.22s;
}
.switch.on{background:linear-gradient(150deg,#DCF08F,#A8C94A)}
.switch.on::after{left:25px}

.pharm{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid rgba(47,59,34,.08);align-items:center}
.pharm:last-child{border-bottom:none;padding-bottom:2px}
.pharm-name{font-size:14.5px;font-weight:900}
.pharm-meta{font-size:11.5px;color:#6E7D5A;font-weight:700;margin-top:4px}
.pharm-price{font-size:15px;font-weight:900;color:#2F3B22;margin-top:5px}
.pharm-price span{font-size:11px;color:#9AA88A;font-weight:700;margin-left:4px}
.pharm-acts{margin-left:auto;display:flex;flex-direction:column;gap:6px}
.mini{
  border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);border-radius:999px;
  font-family:inherit;font-size:11.5px;font-weight:800;color:#4A5836;padding:6px 12px;cursor:pointer;
}
.mini:active{transform:scale(.94)}

/* ============ 饮食结果 ============ */
.result{margin-top:14px;padding-top:14px;border-top:1px dashed rgba(47,59,34,.16)}
.score{
  width:88px;height:88px;border-radius:50%;margin:0 auto 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#EAF9AE,#B8D656 65%,#A8C94A);color:#2F3B22;
  box-shadow:0 12px 24px rgba(168,201,74,.42),inset 0 2px 0 rgba(255,255,255,.8);
}
.score-num{font-size:32px;font-weight:900;line-height:1}
.score-txt{font-size:11px;font-weight:800;margin-top:2px;opacity:.75}
.result.big .score{width:118px;height:118px}
.result.big .score-num{font-size:44px}
.rt{font-size:12px;font-weight:900;color:#6E7D5A;margin:12px 0 6px}
.result.big .rt{font-size:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.8);color:#4A5836;border:1px solid rgba(255,255,255,.95)}
.result.big .tag{font-size:15px;padding:8px 15px}
.ul{margin:0;padding-left:18px}
.ul li{font-size:13px;font-weight:700;line-height:1.7;color:#4A5836}
.ul.good li::marker{color:#8CB63A}
.ul.warn li::marker{color:#E09B2D}
.result.big .ul li{font-size:17px;line-height:1.85}

/* ============ 运动 ============ */
.plan{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(47,59,34,.08)}
.plan:last-child{border-bottom:none}
.plan-ico{
  width:42px;height:42px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:linear-gradient(150deg,rgba(232,245,184,.95),rgba(197,222,106,.8));color:#2F3B22;
}
.plan-name{font-size:14.5px;font-weight:900}
.plan-desc{font-size:11.5px;color:#6E7D5A;font-weight:700;margin-top:4px}
.plan-act{margin-left:auto}

/* ============ 视频 / 通话 ============ */
.video-stage{
  flex:1;margin:0 16px 16px;border-radius:26px;position:relative;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(160deg,#3F4A2E,#2F3B22);
  box-shadow:0 16px 36px rgba(47,59,34,.3);
}
.video-stage.light{background:linear-gradient(160deg,#EAF9AE,#B8D656 70%,#A8C94A)}
.vs-avatar{
  width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);color:#F2F8E4;
}
.video-stage.light .vs-avatar{background:rgba(255,255,255,.55);border-color:rgba(255,255,255,.9);color:#2F3B22}
.vs-name{font-size:19px;font-weight:900;color:#F2F8E4;letter-spacing:.5px}
.video-stage.light .vs-name{color:#2F3B22}
.vs-tip{font-size:12.5px;font-weight:700;color:rgba(242,248,228,.7)}
.video-stage.light .vs-tip{color:#4A5836}
.progress{width:78%;height:9px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden}
.video-stage.light .progress{background:rgba(255,255,255,.7)}
.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#EAF9AE,#B8D656);transition:width .3s}

/* ============ 长辈模式 ============ */
.elder .sec-title{font-size:27px}
.elder .card{padding:20px;border-radius:26px;margin-bottom:14px}
.elder .card-title{font-size:20px}
.elder .card-sub{font-size:15px}
.elder .btn{font-size:19px;padding:17px 20px}
.elder .chip{font-size:16px;padding:10px 16px}
.elder .tab{font-size:12px;padding:9px 2px}
.elder-head{font-size:26px;font-weight:900;letter-spacing:.5px;padding:4px 2px 14px}
.elder-time{font-size:15px;font-weight:900;color:#6E7D5A;letter-spacing:1px}
.elder-dose{font-size:42px;font-weight:900;line-height:1.1;margin:6px 0 2px;letter-spacing:1px}
.elder-med{font-size:23px;font-weight:900;margin-top:6px}
.elder-note{font-size:16px;font-weight:700;color:#6E7D5A;margin-top:8px}
.meal{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(47,59,34,.08)}
.meal:last-child{border-bottom:none}
.meal-name{font-size:19px;font-weight:900;min-width:64px}
.meal-body{font-size:16px;font-weight:700;color:#4A5836;line-height:1.5}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0 6px}
.mic{
  width:132px;height:132px;border-radius:50%;border:none;cursor:pointer;color:#2F3B22;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#EAF9AE,#B8D656 60%,#A8C94A);
  box-shadow:0 18px 36px rgba(168,201,74,.5),inset 0 3px 0 rgba(255,255,255,.85);
  transition:transform .14s;
}
.mic:active{transform:scale(.94)}
.mic-hint{font-size:17px;font-weight:900;color:#4A5836;text-align:center;line-height:1.5}
.voice-chip{
  border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);border-radius:999px;
  padding:12px 18px;font-family:inherit;font-size:17px;font-weight:800;color:#4A5836;cursor:pointer;
}
.voice-chip:active{transform:scale(.96)}
.service{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(47,59,34,.08)}
.service:last-child{border-bottom:none}
.service-name{font-size:17px;font-weight:900}
.service-meta{font-size:13px;color:#6E7D5A;font-weight:700;margin-top:4px}
.einput{
  width:100%;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);
  border-radius:16px;padding:14px;font-size:17px;font-weight:800;font-family:inherit;color:#2F3B22;outline:none;
}
.field{margin-bottom:14px}
.field-label{font-size:16px;font-weight:900;color:#4A5836;margin-bottom:7px}

/* ============ 好友 ============ */
.friend{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(47,59,34,.08)}
.friend:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:50%;background:#C0CBB0;flex:0 0 auto}
.dot.on{background:#8CB63A;box-shadow:0 0 0 4px rgba(140,182,58,.18)}
.friend-name{font-size:15px;font-weight:900}
.friend-meta{font-size:11.5px;color:#6E7D5A;font-weight:700;margin-top:4px}

/* ============ 弹层 / Toast ============ */
.sheet-mask{position:absolute;inset:0;background:rgba(47,59,34,.32);backdrop-filter:blur(3px);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{
  width:100%;border-radius:30px 30px 0 0;padding:20px 20px 26px;max-height:80%;overflow-y:auto;
  background:linear-gradient(160deg,rgba(255,255,255,.97),rgba(244,251,224,.95));
  box-shadow:0 -12px 40px rgba(47,59,34,.25);animation:up .26s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-title{font-size:19px;font-weight:900;margin-bottom:4px}
.sheet-sub{font-size:12.5px;color:#6E7D5A;font-weight:700;margin-bottom:14px;line-height:1.5}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
  background:rgba(47,59,34,.9);color:#F2F8E4;font-size:13px;font-weight:800;
  padding:11px 20px;border-radius:999px;z-index:60;white-space:nowrap;max-width:88%;
  box-shadow:0 10px 24px rgba(47,59,34,.35);animation:fade .2s;
}
.note{
  font-size:12px;font-weight:700;color:#6E7D5A;line-height:1.65;padding:11px 14px;border-radius:16px;
  background:rgba(255,255,255,.55);border:1px dashed rgba(154,168,138,.55);margin-top:12px;
}
.elder .note{font-size:14.5px}

/* ============ 右侧工具 ============ */
.tools{position:fixed;right:22px;bottom:24px;z-index:9;display:flex;flex-direction:column;gap:8px}
.tools .btn{font-size:12px;padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.08);background:#fff}

/* ============ 导出进度 ============ */
.export-mask{
  position:fixed;inset:0;background:rgba(255,255,255,.94);z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  font-size:15px;font-weight:800;color:#2F3B22;
}
.export-mask .bar{width:240px;height:10px;border-radius:999px;background:rgba(47,59,34,.12);overflow:hidden}
.export-mask .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#E4F59C,#A8C94A);width:0;transition:width .25s}
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div id="app"></div>
    <div id="layer"></div>
  </div>
</div>

<div class="tools">

function toast(msg){
  const old = layer.querySelector('.toast'); if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  layer.appendChild(el);
  setTimeout(()=> el.remove(), 1800);
}
function speak(text){
  toast('正在朗读');
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.92; u.pitch = 1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= 交互 ================= */
let codeTimer = null;

function handle(action, el){
  const v = el.dataset.v;
  switch(action){

    /* 登录 */
    case 'send-code': {
      if(codeTimer) return;
      let n = 60;
      el.textContent = n + 's 后重发';
      el.disabled = true;
      codeTimer = setInterval(() => {
        n--;
        if(n <= 0){
          clearInterval(codeTimer); codeTimer = null;
          el.textContent = '获取验证码'; el.disabled = false;
        }else{
          el.textContent = n + 's 后重发';
        }
      }, 1000);
      toast('验证码已发送（演示：123456）');
      break;
    }
    case 'login': {
      const phone = document.getElementById('phoneInput');
      if(phone && phone.value.trim().length < 6){ toast('请输入正确的手机号'); return; }
      state.user.name = '小陈';
      state.screen = 'home';
      toast('登录成功');
      render();
      break;
    }
    case 'wechat-login':
      state.screen = 'home';
      toast('微信登录成功');
      render();
      break;
    case 'guest':
      state.screen = 'home';
      toast('已进入游客模式');
      render();
      break;
    case 'logout':
      state.screen = 'login';
      toast('已退出登录');
      render();
      break;

    /* 导航 */
    case 'go-home':
      state.screen = 'home'; render(); break;
    case 'goto':
      state.screen = v;
      if(v === 'standard') state.mode = 'standard';
      if(v === 'elder') state.mode = 'elder';
      if(v === 'pro') state.mode = 'pro';
      render();
      break;
    case 'cycle-mode': {
      const order = ['standard','elder','pro'];
      const i = order.indexOf(state.mode);
      state.mode = order[(i + 1) % order.length];
      state.screen = state.mode;
      toast(state.mode === 'standard' ? '已切换到标准模式' : state.mode === 'elder' ? '已切换到极简长辈模式' : '已切换到专业管理端');
      render();
      break;
    }
    case 'std-tab':
      state.stdTab = v; render(); break;
    case 'elder-tab':
      state.elderTab = v; render(); break;
    case 'pro-tab':
      state.proTab = v; render(); break;
    case 'back-elder':
      state.screen = 'elder'; state.elderTab = 'sport'; render(); break;

    /* 打卡 */
    case 'check': {
      const k = el.dataset.key;
      state.check[k] = !state.check[k];
      toast(state.check[k] ? '打卡成功' : '已取消打卡');
      render();
      break;
    }
    case 'check-all': {
      state.check.med = true; state.check.diet = true; state.check.sport = true;
      toast('已一键完成全部打卡');
      render();
      break;
    }

    /* 药房 */
    case 'sort':
      state.pharm.sort = v; render(); break;
    case 'insure':
      state.pharm.insureOnly = !state.pharm.insureOnly; render(); break;
    case 'nav':
      toast('正在为「' + el.dataset.name + '」打开地图导航');
      break;
    case 'call':
      toast('正在拨打「' + el.dataset.name + '」');
      break;

    /* 语音 */
    case 'speak':
      speak(el.dataset.text || '');
      break;
    case 'quick':
      if(v === '药师'){
        toast('正在为你接通社区药师 王药师');
        setTimeout(() => speak('你好，我是社区药师，有什么可以帮您？'), 700);
      }else{
        speak('今日提示：早上八点记得吃氨氯地平片一片，饭后服用。今天饮食清淡少油，饭后可以慢走二十分钟。');
      }
      break;
    case 'toast':
      toast(v); break;

    /* 饮食 */
    case 'scan-diet':
    case 'scan-diet-elder': {
      toast('正在识别菜品…');
      setTimeout(() => {
        if(action === 'scan-diet') state.dietScan = true;
        else state.elderDietScan = true;
        render();
        toast('识别完成，评分 ' + DIET_SCAN.score + ' 分');
      }, 900);
      break;
    }

    /* 视频预约 */
    case 'consult-type':
      state.consultType = v; render(); break;
    case 'slot':
      state.slot = v; render(); break;
    case 'confirm-book':
      if(!state.slot){ toast('请先选择时段'); return; }
      state.booked = {type: state.consultType, slot: state.slot};
      toast('预约成功');
      render();
      break;
    case 'rebook':
      state.booked = null; state.slot = null; render(); break;
    case 'join-video':
      state.screen = 'video'; render(); break;
    case 'end-video':
      state.screen = 'standard'; state.stdTab = 'video';
      toast('视频已结束，可重新预约');
      render();
      break;

    /* 档案 / 隐私 */
    case 'toggle':
      state.switches[el.dataset.key] = !state.switches[el.dataset.key];
      render();
      break;
    case 'export-plan':
      toast('已导出「' + v + '」康养方案');
      break;

    /* 长辈模式 - 添加吃药提醒 */
    case 'open-add-med':
      openSheet(
        '<div class="sheet-title">添加吃药提醒</div>'
        + '<div class="sheet-sub">可以按住话筒说药名，也可以直接输入</div>'
        + '<div class="field"><div class="field-label">药名</div>'
        +   '<div class="input-row"><input class="input" id="medName" placeholder="例如：氨氯地平片" value="' + esc(state.addMed.name) + '">'
        +   '<button class="btn small" data-action="add-med-voice" style="white-space:nowrap">' + '说药名' + '</button></div>'
        + '</div>'
        + '<div class="field"><div class="field-label">剂量</div>'
        +   '<div class="chips">'
        +     ['半片','1 片','2 片'].map(d => '<button class="chip ' + (state.addMed.dose===d?'active':'') + '" data-action="set-dose" data-v="' + d + '">' + d + '</button>').join('')
        +   '</div>'
        + '</div>'
        + '<div class="field"><div class="field-label">吃药时间（可多选）</div>'
        +   '<div class="chips">'
        +     ['08:00','12:00','18:00','20:00'].map(t => '<button class="chip ' + (state.addMed.times.indexOf(t)>=0?'active':'') + '" data-action="set-time" data-v="' + t + '">' + t + '</button>').join('')
        +   '</div>'
        + '</div>'
        + '<div class="field"><div class="field-label">备注</div><input class="input" id="medNote" placeholder="例如：饭后服用" value="' + esc(state.addMed.note) + '"></div>'
        + '<button class="btn primary block" data-action="save-med">保存提醒</button>'
        + '<button class="btn text block" data-action="close-sheet">取消</button>'
      );
      break;
    case 'add-med-voice': {
      toast('请说话…');
      setTimeout(() => {
        const inp = document.getElementById('medName');
        if(inp) inp.value = '氨氯地平片';
        state.addMed.name = '氨氯地平片';
        toast('已识别：氨氯地平片');
      }, 1100);
      break;
    }
    case 'set-dose':
      state.addMed.dose = v;
      openMedSheetRefresh();
      break;
    case 'set-time': {
      const i = state.addMed.times.indexOf(v);
      if(i >= 0) state.addMed.times.splice(i,1); else state.addMed.times.push(v);
      openMedSheetRefresh();
      break;
    }
    case 'save-med': {
      const n = document.getElementById('medName');
      const note = document.getElementById('medNote');
      if(n) state.addMed.name = n.value;
      if(note) state.addMed.note = note.value;
      if(!state.addMed.name){ toast('请先填写药名'); return; }
      closeSheet();
      toast('已添加提醒：' + state.addMed.name + '　' + state.addMed.times.join('、'));
      speak('已为您添加吃药提醒，' + state.addMed.name + '，' + state.addMed.dose + '，时间' + state.addMed.times.join('、'));
      break;
    }
    case 'close-sheet':
      closeSheet(); break;

    /* 长辈模式 - 饮食 */
    case 'set-gender':
      state.member.gender = v; render(); break;
    case 'add-tag': {
      const cur = state.member.other ? state.member.other.split('、') : [];
      if(cur.indexOf(v) < 0) cur.push(v);
      state.member.other = cur.join('、');
      toast('已添加：' + v);
      render();
      break;
    }

    /* 长辈模式 - 视频 */
    case 'play-elder-video': {
      const vd = state.video;
      vd.playing = !vd.playing;
      if(vd.playing){
        if(!vd.timer){
          vd.timer = setInterval(() => {
            vd.progress += 2;
            if(vd.progress >= 100){ vd.progress = 100; vd.playing = false; clearInterval(vd.timer); vd.timer = null; }
            const bar = app.querySelector('.progress i');
            if(bar) bar.style.width = vd.progress + '%';
            if(!vd.playing) render();
          }, 120);
        }
        toast('开始播放教学视频');
      }else{
        if(vd.timer){ clearInterval(vd.timer); vd.timer = null; }
        toast('已暂停');
      }
      render();
      break;
    }

    /* 长辈模式 - 语音连线 */
    case 'mic':
      toast('请说话…');
      setTimeout(() => {
        const who = '女儿';
        toast('已识别：打给' + who);
        setTimeout(() => startCall(who), 500);
      }, 1100);
      break;
    case 'voice-call':
      startCall(el.dataset.who);
      break;

    /* 一起锻炼 */
    case 'goto-together':
      state.screen = 'together';
      state.together = {stage:'list', friend:null, sec:0, timer:null};
      render();
      break;
    case 'call-friend': {
      const f = el.dataset.name;
      state.together.friend = f;
      state.together.stage = 'calling';
      render();
      setTimeout(() => {
        if(state.screen !== 'together' || state.together.stage !== 'calling') return;
        state.together.stage = 'active';
        state.together.sec = 0;
        render();
        toast('已接通，一起做坐姿抬腿');
        if(state.together.timer) clearInterval(state.together.timer);
        state.together.timer = setInterval(() => {
          if(state.screen !== 'together' || state.together.stage !== 'active') return;
          state.together.sec++;
          const p = app.querySelector('.progress i');
          if(p) p.style.width = Math.min(100, state.together.sec * 2) + '%';
          const t = app.querySelector('.card-sub');
          if(t && t.textContent.indexOf('坐姿抬腿') >= 0) t.textContent = '坐姿抬腿 · 第 ' + (state.together.sec + 1) + ' 秒';
        }, 1000);
      }, 1600);
      break;
    }
    case 'end-together':
      if(state.together.timer){ clearInterval(state.together.timer); state.together.timer = null; }
      state.together.stage = 'list';
      state.together.friend = null;
      toast('已结束一起锻炼');
      render();
      break;
  }
}

/* 把手机临时展开为"完整长图"模式 */
function enterCaptureMode(){
  document.querySelector('.phone').classList.add('capturing');
}
function exitCaptureMode(){
  document.querySelector('.phone').classList.remove('capturing');
}

/* 核心：把 .screen 截成 JPG 并下载 */
async function captureScreen(filename){
  const screenEl = document.querySelector('.screen');
  enterCaptureMode();
  await sleep(120); // 等布局展开

  const canvas = await html2canvas(screenEl, {
    backgroundColor:'#F1F9DC',
    scale:2,
    useCORS:true,
    logging:false,
    scrollX:0,
    scrollY:0,
    width: screenEl.scrollWidth,
    height: screenEl.scrollHeight,
    windowWidth: screenEl.scrollWidth,
    windowHeight: screenEl.scrollHeight
  });

  const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  const a = document.createElement('a');
  a.download = filename + '.jpg';
  a.href = dataUrl;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  exitCaptureMode();
  await sleep(120);
}

/* 进度遮罩 */
function showProgress(text, percent){
  let mask = document.getElementById('exportMask');
  if(!mask){
    mask = document.createElement('div');
    mask.id = 'exportMask';
    mask.className = 'export-mask';
    mask.innerHTML = '<div id="exportText">准备导出…</div><div class="bar"><i id="exportBar"></i></div>'
      + '<div style="font-size:12px;font-weight:600;color:#6E7D5A">JPG 长图 · 保存在浏览器下载目录</div>';
    document.body.appendChild(mask);
  }
  document.getElementById('exportText').textContent = text;
  document.getElementById('exportBar').style.width = percent + '%';
}
function hideProgress(){
  const mask = document.getElementById('exportMask');
  if(mask) mask.remove();
}

/* 导出全部页面 */
async function exportAllJPG(){
  // 备份原始状态
  const backup = JSON.parse(JSON.stringify({
    screen: state.screen,
    mode: state.mode,
    stdTab: state.stdTab,
    elderTab: state.elderTab,
    proTab: state.proTab,
    dietScan: state.dietScan,
    elderDietScan: state.elderDietScan,
    booked: state.booked,
    check: state.check
  }));

  layer.innerHTML = '';
  const total = EXPORT_PAGES.length;

  for(let i = 0; i < total; i++){
    const page = EXPORT_PAGES[i];
    showProgress('正在导出：' + page.name + '（' + (i+1) + '/' + total + '）', Math.round(i / total * 100));

    // 先还原基础状态，再套用当前页的设置
    state.screen   = backup.screen;
    state.mode     = backup.mode;
    state.stdTab   = backup.stdTab;
    state.elderTab = backup.elderTab;
    state.proTab   = backup.proTab;
    state.dietScan = backup.dietScan;
    state.elderDietScan = backup.elderDietScan;
    state.booked   = backup.booked;

    page.setup();
    render();
    layer.innerHTML = '';
    await sleep(220);

    try{
      await captureScreen(page.name);
    }catch(err){
      console.error('导出失败：' + page.name, err);
    }
    await sleep(260);
  }

  // 还原
  state.screen   = backup.screen;
  state.mode     = backup.mode;
  state.stdTab   = backup.stdTab;
  state.elderTab = backup.elderTab;
  state.proTab   = backup.proTab;
  state.dietScan = backup.dietScan;
  state.elderDietScan = backup.elderDietScan;
  state.booked   = backup.booked;
  render();

  showProgress('全部 ' + total + ' 张已导出完成', 100);
  setTimeout(() => { hideProgress(); toast('全部页面长图已导出为 JPG'); }, 700);
}

/* 导出当前页面 */
async function exportCurrentJPG(){
  layer.innerHTML = '';
  showProgress('正在导出当前页…', 40);
  const map = {
    login:'01_登录页',
    home:'02_首页',
    standard:'03_标准模式_' + ({today:'今日康养', diet:'饮食调整', sport:'居家运动', video:'预约视频', profile:'我的档案'}[state.stdTab] || '今日康养'),
    elder:'08_长辈模式_' + ({med:'吃药', diet:'饮食', sport:'运动', link:'连线', info:'资料'}[state.elderTab] || '吃药'),
    pro:'15_专业管理端_' + ({users:'用户档案', work:'视频工作台', plan:'方案配置'}[state.proTab] || '用户档案'),
    together:'13_一起锻炼',
    video:'18_面对面视频'
  };
  const name = map[state.screen] || '当前页';
  await sleep(120);
  try{
    await captureScreen(name);
    showProgress('导出完成', 100);
  }catch(e){
    console.error(e);
  }
  setTimeout(hideProgress, 600);
}

/* ================= 启动 ================= */
render();
</script>
